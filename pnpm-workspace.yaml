allowBuilds:
  '@parcel/watcher': false
  core-js: false
  core-js-pure: false
  esbuild: true
  fs-ext-extra-prebuilt: false
  puppeteer: true

# Security overrides for advisories in dev-only transitive deps. These never ship
# (node_modules is excluded from the build); every bump stays within the dependency's
# existing major, so build/test tool behavior is unchanged — only the patched version
# is forced. Each covers one or more high-severity advisories.
overrides:
  cross-spawn@<6.0.6: '>=6.0.6'
  tar-fs@>=2.0.0 <2.1.4: '>=2.1.4'
  tar-fs@>=3.0.0 <3.1.1: '>=3.1.1'
  adm-zip@<0.6.0: '>=0.6.0 <0.7.0'
  linkify-it@<5.0.2: '>=5.0.2 <6.0.0'
  minimatch@<3.1.4: '>=3.1.4 <4.0.0'
  minimatch@>=9.0.0 <9.0.7: '>=9.0.7 <10.0.0'
  nanoid@<3.3.17: '>=3.3.17 <4.0.0'
  serialize-javascript@<7.0.3: '>=7.0.3 <8.0.0'
  ws@>=8.0.0 <8.21.0: '>=8.21.0 <9.0.0'
